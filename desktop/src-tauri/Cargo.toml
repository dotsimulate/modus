[package]
name = "modus-desktop"
version = "0.3.4"
description = "Modus desktop client"
authors = ["Modus contributors"]
license = "FSL-1.1-ALv2"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The crate wry binds the Linux webview with, so `with_webview` hands back a
# type from this exact resolution rather than a second, incompatible copy.
# Used only by src/media_permission.rs; never compiled on Windows or macOS.
webkit2gtk = { version = "2.0.2", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
