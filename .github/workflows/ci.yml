name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-and-ui:
    name: Bun tests, typechecks, and UI build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Configure isolated state paths
        shell: pwsh
        env:
          MODUS_CI_ROOT: ${{ runner.temp }}\modus-ci
        run: |
          @(
            "MODUS_HOME=$env:MODUS_CI_ROOT\home"
            "MODUS_CONFIG_DIR=$env:MODUS_CI_ROOT\config"
            "MODUS_DATA_DIR=$env:MODUS_CI_ROOT\data"
            "MODUS_LOGS_DIR=$env:MODUS_CI_ROOT\logs"
            "MODUS_RUNTIME_DIR=$env:MODUS_CI_ROOT\runtime"
            "MODUS_CACHE_DIR=$env:MODUS_CI_ROOT\cache"
            "HARNESS_SECRETS_FILE=$env:MODUS_CI_ROOT\config\secrets.env"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install harness dependencies
        working-directory: harness
        run: bun install --frozen-lockfile
      - name: Install UI dependencies
        working-directory: harness/ui
        run: bun install --frozen-lockfile
      - name: Enforce publication boundary
        shell: pwsh
        run: ./.github/scripts/check-publication-boundary.ps1
      - name: Run Bun tests
        working-directory: harness
        run: bun test
      - name: Typecheck harness
        run: bun x tsc -p harness/tsconfig.json --noEmit
      - name: Typecheck UI application
        run: bun x tsc -p harness/ui/tsconfig.app.json --noEmit
      - name: Typecheck UI build tooling
        run: bun x tsc -p harness/ui/tsconfig.node.json --noEmit
      - name: Build production UI
        working-directory: harness/ui
        run: bun run build

  rust:
    name: Rust format, lint, test, and build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Configure isolated state paths
        shell: pwsh
        env:
          MODUS_CI_ROOT: ${{ runner.temp }}\modus-ci
        run: |
          @(
            "MODUS_HOME=$env:MODUS_CI_ROOT\home"
            "MODUS_CONFIG_DIR=$env:MODUS_CI_ROOT\config"
            "MODUS_DATA_DIR=$env:MODUS_CI_ROOT\data"
            "MODUS_LOGS_DIR=$env:MODUS_CI_ROOT\logs"
            "MODUS_RUNTIME_DIR=$env:MODUS_CI_ROOT\runtime"
            "MODUS_CACHE_DIR=$env:MODUS_CI_ROOT\cache"
            "HARNESS_SECRETS_FILE=$env:MODUS_CI_ROOT\config\secrets.env"
            "CARGO_TARGET_DIR=$env:MODUS_CI_ROOT\cargo-target"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action; toolchain fixed below
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Create non-packaging Tauri fixtures
        shell: pwsh
        run: |
          $sidecarFixture = "desktop/src-tauri/binaries/bun-x86_64-pc-windows-msvc.exe"
          $resourceFixture = "desktop/src-tauri/resources/modus"
          if (Test-Path -LiteralPath $sidecarFixture) {
            throw "Refusing to replace an existing sidecar at $sidecarFixture"
          }
          if (Test-Path -LiteralPath $resourceFixture) {
            throw "Refusing to replace existing resources at $resourceFixture"
          }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $sidecarFixture) | Out-Null
          New-Item -ItemType File -Path $sidecarFixture | Out-Null
          New-Item -ItemType Directory -Path $resourceFixture | Out-Null
      - name: Format check
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - name: Build
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --locked
