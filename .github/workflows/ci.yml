name: CI

# Source-tree gate, not release qualification. Packaging, signing, installer
# launch, upgrade/rollback, and platform qualification remain separate
# (RELEASES.md).
#
# Private solo phase: pushes to main are a post-push alarm. They cannot stop
# the commit from landing. pull_request and workflow_dispatch run the full job
# set. The production UI build and desktop Rust job are skipped on main pushes
# whose trees they do not cover; .github/ changes fail toward running extras.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      ui_build: ${{ steps.classify.outputs.ui_build }}
      rust: ${{ steps.classify.outputs.rust }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Fetch push base for path diff
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: git fetch --no-tags --prune --depth=1 origin ${{ github.event.before }}
      - name: Classify
        id: classify
        shell: pwsh
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_SHA: ${{ github.sha }}
        run: ./.github/scripts/classify-ci-paths.ps1

  bun-and-ui:
    name: Bun tests, typechecks, and UI build
    needs: classify
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Configure isolated state paths
        shell: pwsh
        env:
          MODUS_CI_ROOT: ${{ runner.temp }}\modus-ci
        run: |
          @(
            "MODUS_HOME=$env:MODUS_CI_ROOT\home"
            "MODUS_CONFIG_DIR=$env:MODUS_CI_ROOT\config"
            "MODUS_DATA_DIR=$env:MODUS_CI_ROOT\data"
            "MODUS_LOGS_DIR=$env:MODUS_CI_ROOT\logs"
            "MODUS_RUNTIME_DIR=$env:MODUS_CI_ROOT\runtime"
            "MODUS_CACHE_DIR=$env:MODUS_CI_ROOT\cache"
            "HARNESS_SECRETS_FILE=$env:MODUS_CI_ROOT\config\secrets.env"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install harness dependencies
        working-directory: harness
        run: bun install --frozen-lockfile
      - name: Install UI dependencies
        working-directory: harness/ui
        run: bun install --frozen-lockfile
      - name: Install desktop tooling dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Audit root dependencies
        run: bun audit
      - name: Audit harness dependencies
        working-directory: harness
        run: bun audit
      - name: Audit UI dependencies
        working-directory: harness/ui
        run: bun audit
      - name: Audit desktop tooling dependencies
        working-directory: desktop
        run: bun audit
      - name: Enforce publication boundary
        shell: pwsh
        run: ./.github/scripts/check-publication-boundary.ps1
      - name: Run Bun tests
        working-directory: harness
        run: bun test
      - name: Typecheck harness
        run: bun x tsc -p harness/tsconfig.json --noEmit
      - name: Typecheck UI application
        run: bun x tsc -p harness/ui/tsconfig.app.json --noEmit
      - name: Typecheck UI build tooling
        run: bun x tsc -p harness/ui/tsconfig.node.json --noEmit
      - name: Build production UI
        if: needs.classify.outputs.ui_build == 'true'
        working-directory: harness/ui
        run: bun run build

  rust:
    name: Rust format, lint, test, and build
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Configure isolated state paths
        shell: pwsh
        env:
          MODUS_CI_ROOT: ${{ runner.temp }}\modus-ci
        run: |
          @(
            "MODUS_HOME=$env:MODUS_CI_ROOT\home"
            "MODUS_CONFIG_DIR=$env:MODUS_CI_ROOT\config"
            "MODUS_DATA_DIR=$env:MODUS_CI_ROOT\data"
            "MODUS_LOGS_DIR=$env:MODUS_CI_ROOT\logs"
            "MODUS_RUNTIME_DIR=$env:MODUS_CI_ROOT\runtime"
            "MODUS_CACHE_DIR=$env:MODUS_CI_ROOT\cache"
            "HARNESS_SECRETS_FILE=$env:MODUS_CI_ROOT\config\secrets.env"
            "CARGO_TARGET_DIR=$env:MODUS_CI_ROOT\cargo-target"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action; toolchain fixed below
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Create non-packaging Tauri fixtures
        shell: pwsh
        run: |
          # One fixture per bundle.externalBin entry in tauri.conf.json. The
          # build script fails on any declared sidecar that is missing, so a new
          # externalBin needs a matching name here.
          $sidecarFixtures = @(
            "desktop/src-tauri/binaries/bun-x86_64-pc-windows-msvc.exe",
            "desktop/src-tauri/binaries/modus-x86_64-pc-windows-msvc.exe"
          )
          $resourceFixture = "desktop/src-tauri/resources/modus"
          foreach ($sidecarFixture in $sidecarFixtures) {
            if (Test-Path -LiteralPath $sidecarFixture) {
              throw "Refusing to replace an existing sidecar at $sidecarFixture"
            }
          }
          if (Test-Path -LiteralPath $resourceFixture) {
            throw "Refusing to replace existing resources at $resourceFixture"
          }
          foreach ($sidecarFixture in $sidecarFixtures) {
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $sidecarFixture) | Out-Null
            New-Item -ItemType File -Path $sidecarFixture | Out-Null
          }
          New-Item -ItemType Directory -Path $resourceFixture | Out-Null
      - name: Format check
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - name: Build
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --locked
      - name: Format check (cli-launcher)
        run: cargo fmt --manifest-path desktop/cli-launcher/Cargo.toml --check
      - name: Clippy (cli-launcher)
        run: cargo clippy --manifest-path desktop/cli-launcher/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test (cli-launcher)
        run: cargo test --manifest-path desktop/cli-launcher/Cargo.toml --locked
      - name: Build (cli-launcher)
        run: cargo build --manifest-path desktop/cli-launcher/Cargo.toml --locked
      # The crate license text this reads lives in the cargo registry, which the
      # builds above populate. This is the only job that has it, so it owns the
      # Rust half of the notices check; the Bun job owns the JavaScript half.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Verify Rust third-party notices
        working-directory: harness
        run: bun run notices:check rust
